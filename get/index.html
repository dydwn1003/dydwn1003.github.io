<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>저승사자 키우기 다운로드</title>
<meta name="description" content="저승사자 키우기 — 안드로이드는 Google Play, 아이폰은 App Store로 이동해요.">
<meta property="og:title" content="저승사자 키우기">
<meta property="og:description" content="떠도는 혼을 거두고 승진해서 염라대왕이 되어 보세요. 도트 방치형 게임">
<meta property="og:image" content="https://dydwn1003.github.io/icon.png">
<meta property="og:url" content="https://dydwn1003.github.io/get/">
<link rel="icon" href="../icon.png">
<script>
// 기기를 보고 바로 스토어로 보냄. ?src=insta 처럼 붙이면 Play 유입 경로(referrer)로 넘어감
(function () {
  var PLAY = 'https://play.google.com/store/apps/details?id=com.jeoseungsaja.idle';
  var IOS = 'https://apps.apple.com/app/id6832605954';
  var src = (location.search.match(/[?&]src=([^&]+)/) || [])[1];
  if (src) PLAY += '&referrer=' + encodeURIComponent('utm_source=' + decodeURIComponent(src) + '&utm_medium=link');
  var ua = navigator.userAgent || '';
  var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1); // iPad는 Mac처럼 보임
  var android = /Android/i.test(ua);
  window.__links = { play: PLAY, ios: IOS };
  if (ios) location.replace(IOS); else if (android) location.replace(PLAY);
})();
</script>
<style>
  :root { color-scheme: light dark; --bg: #f6f4fb; --fg: #1d1a2b; --sub: #5d5873; --card: #ffffff; --line: #e3dff0; --acc: #c23a4a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14121f; --fg: #eeeaf8; --sub: #a9a3c0; --card: #1e1b2e; --line: #2f2a44; --acc: #ff6b7a; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.7 -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  main { max-width: 420px; margin: 0 auto; padding: 48px 16px; text-align: center; }
  img { width: 112px; height: 112px; border-radius: 24px; image-rendering: pixelated; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  h1 { font-size: 22px; margin: 16px 0 4px; }
  p { margin: 0 0 20px; color: var(--sub); }
  .links { display: flex; flex-direction: column; gap: 10px; }
  .links a { display: block; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--fg); text-decoration: none; font-weight: 700; }
  .links a:hover, .links a:focus-visible { border-color: var(--acc); outline: none; }
</style>
</head>
<body>
<main>
  <img src="../icon.png" alt="저승사자 키우기 아이콘">
  <h1>저승사자 키우기</h1>
  <p>스토어로 이동하고 있어요. 바로 열리지 않으면 아래에서 골라 주세요.</p>
  <div class="links">
    <a id="a-play" href="https://play.google.com/store/apps/details?id=com.jeoseungsaja.idle">Google Play (안드로이드)</a>
    <a id="a-ios" href="https://apps.apple.com/app/id6832605954">App Store (아이폰·아이패드)</a>
  </div>
</main>
<script>document.getElementById('a-play').href = window.__links.play;</script>
</body>
</html>
